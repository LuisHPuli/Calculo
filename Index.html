<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derivada de sen, cos y tan elevadas a una potencia</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--panel:#ffffff;--ink:#1b2a26;--mute:#5d6b66;--line:#d5dbd6;--pot:#c2410c;--trig:#1d6fa5;--arg:#4d7c0f;--res:#7c3aed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b17;--panel:#16261f;--ink:#eef3ee;--mute:#9db0a7;--line:#2c4238;--pot:#fb923c;--trig:#7cc4f2;--arg:#a3d95b;--res:#c4a7ff}}
:root[data-theme="dark"]{--bg:#0f1b17;--panel:#16261f;--ink:#eef3ee;--mute:#9db0a7;--line:#2c4238;--pot:#fb923c;--trig:#7cc4f2;--arg:#a3d95b;--res:#c4a7ff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:760px;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px}
.screen{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 18px;min-height:440px;display:flex;flex-direction:column;gap:12px}
h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:1.45rem;margin:0;line-height:1.25}
.sub{color:var(--mute);font-size:.95rem;margin:0}
.line{font-family:'Source Serif 4',Georgia,serif;font-size:1.3rem;line-height:1.6;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s;overflow-x:auto;max-width:100%}
.line.on{opacity:1;transform:none}
.line small{display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-size:.88rem;color:var(--mute);line-height:1.4}
.big{font-size:1.6rem}
.res{border-left:4px solid var(--res);padding-left:12px}
.p{color:var(--pot)}.t{color:var(--trig)}.a{color:var(--arg)}.r{color:var(--res)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem}
table{border-collapse:collapse;font-family:'Source Serif 4',serif;font-size:1.15rem}
td{padding:4px 14px 4px 0}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:64px;font-size:1rem;line-height:1.45}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--trig)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}
button:focus-visible{outline:3px solid var(--trig);outline-offset:2px}
button.main{background:var(--trig);color:#fff;border-color:var(--trig);font-weight:700}
.dots{display:flex;gap:6px;margin-left:auto}
.dots b{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots b.on{background:var(--trig)}
sup{font-size:.7em}
@media (prefers-reduced-motion:reduce){.line{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="screen" id="screen" aria-live="polite"></div>
  <div class="cap" id="cap"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="ctl">
    <button id="prev" aria-label="Escena anterior">‹ Atrás</button>
    <button id="play" class="main">Pausar</button>
    <button id="next" aria-label="Escena siguiente">Siguiente ›</button>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script>
var L='<div class="legend"><span class="p">■ potencia</span><span class="t">■ función trig.</span><span class="a">■ argumento</span></div>';
var S=[
{t:'Derivada de una función trigonométrica elevada a una potencia',s:'Ejemplo de la forma y = sen<sup>n</sup>(u)',
 l:['<span class="big">y = <span class="t">sen</span><sup class="p">n</sup>(<span class="a">u</span>)</span><small>u puede ser una suma, un producto, un cociente o una función compuesta</small>',L],
 c:['Vamos a derivar funciones como seno al cubo de algo. Primero veamos la idea general.','Siempre hay tres capas: la potencia, la función trigonométrica y el argumento.']},
{t:'La regla general',s:'Regla de la cadena aplicada tres veces',
 l:['<span class="big">y\' = <span class="p">n</span>·<span class="t">sen</span><sup class="p">n−1</sup>(<span class="a">u</span>) · <span class="t">cos</span>(<span class="a">u</span>) · <span class="a">u\'</span></span>','<span class="p">1.</span> Baja el exponente y réstale 1.','<span class="t">2.</span> Deriva la función trigonométrica, dejando u igual.','<span class="a">3.</span> Multiplica por la derivada del argumento, u\'.'],
 c:['Primero se deriva la potencia: el exponente baja y se reduce en uno.','Luego se deriva la función trigonométrica sin tocar el argumento.','Por último, se multiplica por la derivada del argumento. Aquí es donde cambia cada ejercicio.']},
{t:'Derivadas trigonométricas que necesitas',s:'Con u como argumento, multiplica siempre por u\'',
 l:['<table><tr><td>(sen u)\' =</td><td>cos u · u\'</td></tr><tr><td>(cos u)\' =</td><td>−sen u · u\'</td></tr><tr><td>(tan u)\' =</td><td>sec<sup>2</sup>u · u\'</td></tr><tr><td>(sec u)\' =</td><td>sec u · tan u · u\'</td></tr></table>'],
 c:['Estas son las derivadas básicas. Fíjate en el signo negativo del coseno.','Todas terminan multiplicadas por u prima, por la regla de la cadena.']},
{t:'Caso 1: argumento con suma y resta',s:'Regla término a término',
 l:['y = <span class="t">sen</span><sup class="p">3</sup>(<span class="a">x<sup>2</sup> + 3x</span>)','<span class="a">u = x² + 3x</span> → u\' = 2x + 3<small>Se deriva cada término por separado</small>','y\' = <span class="p">3</span><span class="t">sen</span><sup class="p">2</sup>(<span class="a">u</span>) · <span class="t">cos</span>(<span class="a">u</span>) · <span class="a">(2x + 3)</span>','<div class="res">y\' = 3 sen²(x² + 3x) · cos(x² + 3x) · (2x + 3)</div>'],
 c:['Tenemos seno al cubo de x cuadrada más tres x.','El argumento es una suma, así que derivamos término a término: dos x más tres.','Armamos las tres capas y obtenemos el resultado.']},
{t:'Caso 2: argumento con producto',s:'Regla del producto dentro del argumento',
 l:['y = <span class="t">cos</span><sup class="p">4</sup>(<span class="a">x·eˣ</span>)','<span class="a">u = x·eˣ</span> → u\' = 1·eˣ + x·eˣ = eˣ(1 + x)<small>(f·g)\' = f\'g + fg\'</small>','y\' = <span class="p">4</span><span class="t">cos</span><sup class="p">3</sup>(<span class="a">u</span>) · (<span class="t">−sen</span>(<span class="a">u</span>)) · <span class="a">eˣ(1 + x)</span>','<div class="res">y\' = −4eˣ(1 + x) · cos³(x·eˣ) · sen(x·eˣ)</div>'],
 c:['Ahora el argumento es un producto: x por e a la x.','Usamos la regla del producto: derivada del primero por el segundo, más el primero por la derivada del segundo.','Observa que el coseno aporta un signo negativo.']},
{t:'Caso 3: argumento con cociente',s:'Regla del cociente dentro del argumento',
 l:['y = <span class="t">tan</span><sup class="p">2</sup>(<span class="a">x / (x+1)</span>)','<span class="a">u\' = [1·(x+1) − x·1] / (x+1)² = 1/(x+1)²</span><small>(f/g)\' = (f\'g − fg\')/g²</small>','y\' = <span class="p">2</span><span class="t">tan</span>(<span class="a">u</span>) · <span class="t">sec</span><sup>2</sup>(<span class="a">u</span>) · <span class="a">1/(x+1)²</span>','<div class="res">y\' = 2 tan(x/(x+1)) · sec²(x/(x+1)) / (x+1)²</div>'],
 c:['Aquí el argumento es un cociente.','Aplicamos la regla del cociente: numerador derivado por denominador, menos numerador por denominador derivado, todo entre el denominador al cuadrado.','Luego completamos las tres capas.']},
{t:'Caso 4: argumento compuesto',s:'Otra regla de la cadena dentro del argumento',
 l:['y = <span class="t">sen</span><sup class="p">3</sup>(<span class="a">e<sup>2x</sup></span>)','<span class="a">u = e²ˣ</span> → u\' = e²ˣ · 2 = 2e²ˣ<small>Cadena interna: derivada de eᵛ es eᵛ·v\'</small>','y\' = <span class="p">3</span><span class="t">sen</span><sup class="p">2</sup>(<span class="a">u</span>) · <span class="t">cos</span>(<span class="a">u</span>) · <span class="a">2e²ˣ</span>','<div class="res">y\' = 6e²ˣ · sen²(e²ˣ) · cos(e²ˣ)</div>'],
 c:['Ahora el argumento mismo es una función compuesta.','Derivamos e a la dos x con otra regla de la cadena: queda dos e a la dos x.','Multiplicamos todo y ordenamos el resultado.']},
{t:'Resumen',s:'Un método para cualquier ejercicio',
 l:['<span class="p">1.</span> Identifica potencia, función trigonométrica y argumento u.','<span class="a">2.</span> Calcula u\' con la regla que corresponda: suma, producto o cociente, o cadena.','<span class="t">3.</span> Multiplica: n · f<sup>n−1</sup>(u) · f\'(u) · u\'.','<small>Consejo: escribe u aparte antes de derivar.</small>'],
 c:['Identifica las tres capas, deriva el argumento con su regla y multiplica todo.','Con práctica, este orden se vuelve automático.']}
];
var scr=document.getElementById('screen'),cap=document.getElementById('cap'),bar=document.getElementById('bar'),dots=document.getElementById('dots'),playB=document.getElementById('play');
var si=0,li=0,playing=true,timer=null;
S.forEach(function(){dots.appendChild(document.createElement('b'))});
function render(){
 var s=S[si];
 scr.innerHTML='<h1>'+s.t+'</h1><p class="sub">'+s.s+'</p>'+s.l.map(function(x){return '<div class="line">'+x+'</div>'}).join('');
 [].forEach.call(dots.children,function(d,i){d.className=i===si?'on':''});
 li=0;cap.textContent='';bar.style.width=(si/S.length*100)+'%';step();
}
function step(){
 clearTimeout(timer);
 var ls=scr.querySelectorAll('.line'),s=S[si];
 if(li<ls.length){
  ls[li].classList.add('on');
  var ci=Math.min(li-(ls.length-s.c.length),s.c.length-1);
  cap.textContent=s.c[Math.max(ci,0)];
  li++;
  bar.style.width=((si+li/ls.length)/S.length*100)+'%';
  if(playing)timer=setTimeout(step,li===1&&si===0?2600:3200);
 }else if(playing){
  timer=setTimeout(function(){go(si+1)},3500);
 }
}
function go(n){
 if(n<0)n=0;
 if(n>=S.length){playing=false;playB.textContent='Repetir';return}
 si=n;render();
}
playB.onclick=function(){
 if(playB.textContent==='Repetir'){playing=true;playB.textContent='Pausar';go(0);return}
 playing=!playing;playB.textContent=playing?'Pausar':'Reanudar';
 if(playing)step();else clearTimeout(timer);
};
document.getElementById('next').onclick=function(){go(si+1)};
document.getElementById('prev').onclick=function(){go(si-1)};
render();
</script>
</body>
</html>
